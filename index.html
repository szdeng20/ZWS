
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  #game{width:100%;aspect-ratio:16/9;min-height:480px;display:flex;flex-direction:column;padding:24px 32px 18px;font-family:var(--font-sans);overflow:hidden;}
  .screen{display:none;height:100%;flex-direction:column;}
  .screen.active{display:flex;}
  .score-bar{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
  .stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:7px 16px;font-size:15px;color:var(--color-text-secondary);}
  .stat b{color:var(--color-text-primary);font-weight:500;}
  .progress-track{height:7px;background:var(--color-background-secondary);border-radius:4px;margin-bottom:14px;overflow:hidden;}
  .progress-fill{height:100%;background:#3B6D11;border-radius:4px;transition:width .4s;}
  .btn{padding:11px 22px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:16px;cursor:pointer;font-weight:500;color:var(--color-text-primary);transition:background .15s;}
  .btn:hover{background:var(--color-background-secondary);}
  .btn.primary{background:#27500A;color:#EAF3DE;border-color:transparent;}
  .btn.primary:hover{opacity:.88;}
  .nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:10px;}
  .feedback{font-size:15px;padding:11px 15px;border-radius:var(--border-radius-md);line-height:1.6;}
  .feedback.success{background:#EAF3DE;color:#27500A;border:0.5px solid #97C459;}
  .feedback.error{background:#FCEBEB;color:#791F1F;border:0.5px solid #F09595;}

  .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;align-items:center;}
  .home-btns{display:flex;flex-direction:column;gap:12px;}
  .home-illus{display:flex;align-items:center;justify-content:center;}

  .sort-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;overflow:hidden;}
  .sort-left{display:flex;flex-direction:column;gap:10px;}
  .sort-right{display:flex;flex-direction:column;gap:8px;overflow-y:auto;}
  .waste-tray{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;}
  .drop-zone{border:2px dashed var(--color-border-secondary);border-radius:var(--border-radius-lg);padding:12px;flex:1;transition:background .2s,border-color .2s;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
  .drop-zone:hover{background:var(--color-background-secondary);}
  .drop-zone.over{background:#E1F5EE;border-color:#1D9E75;}
  .drop-zone.correct{background:#EAF3DE;border-color:#3B6D11;border-style:solid;}
  .drop-zone.wrong{background:#FCEBEB;border-color:#A32D2D;border-style:solid;}
  .zone-label{font-size:14px;font-weight:500;color:var(--color-text-secondary);margin-top:4px;}
  .drag-item{cursor:grab;transition:opacity .15s,transform .15s;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .drag-item:active{cursor:grabbing;opacity:.7;transform:scale(.95);}
  .drag-item.placed{opacity:.3;pointer-events:none;}
  .result-chip{font-size:13px;padding:3px 10px;border-radius:20px;margin-top:4px;}
  .chip-ok{background:#EAF3DE;color:#27500A;border:0.5px solid #97C459;}
  .chip-bad{background:#FCEBEB;color:#791F1F;border:0.5px solid #F09595;}

  .pipe-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;flex:1;overflow:hidden;}
  .pipe-left{display:flex;flex-direction:column;gap:7px;overflow-y:auto;}
  .pipe-right{display:flex;flex-direction:column;gap:10px;}
  .pipe-bank{display:flex;flex-direction:column;gap:7px;padding:12px;background:var(--color-background-secondary);border-radius:var(--border-radius-lg);flex:1;overflow-y:auto;}
  .pipe-slot{display:flex;align-items:center;gap:10px;padding:9px 13px;border:1.5px dashed var(--color-border-secondary);border-radius:var(--border-radius-md);min-height:50px;background:var(--color-background-secondary);font-size:15px;color:var(--color-text-secondary);}
  .bank-item{padding:9px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);font-size:15px;cursor:grab;display:flex;align-items:center;gap:10px;user-select:none;color:var(--color-text-primary);}
  .bank-item.placed{opacity:.3;pointer-events:none;}

  .quiz-layout{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;align-items:start;}
  .quiz-q{font-size:19px;font-weight:500;color:var(--color-text-primary);margin-bottom:14px;line-height:1.5;}
  .quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .quiz-opt{padding:0;border-radius:var(--border-radius-lg);border:2px solid var(--color-border-secondary);background:var(--color-background-primary);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;transition:border-color .15s,background .15s;}
  .quiz-opt:hover:not(:disabled){background:var(--color-background-secondary);}
  .quiz-opt.correct{background:#EAF3DE;border-color:#3B6D11;}
  .quiz-opt.wrong{background:#FCEBEB;border-color:#A32D2D;}
  .opt-label{font-size:14px;color:var(--color-text-secondary);text-align:center;line-height:1.4;}
  .quiz-opt.correct .opt-label{color:#27500A;}
  .quiz-opt.wrong .opt-label{color:#791F1F;}

  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
  .result-card{padding:18px;border-radius:var(--border-radius-lg);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);text-align:center;}
  .result-card .rc-val{font-size:34px;font-weight:500;color:var(--color-text-primary);}
  .result-card .rc-lbl{font-size:14px;color:var(--color-text-secondary);margin-top:3px;}
  h2.gtitle{font-size:26px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px;}
  .gsub{font-size:16px;color:var(--color-text-secondary);margin-bottom:14px;line-height:1.5;}
</style>

function shuffle(arr){return [...arr].sort(()=>Math.random()-.5);}

let sortState={round:0,score:0,streak:0};

function showHome(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-home').classList.add('active');}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

function startMode(m){
  if(m==='sort'){sortState={round:0,score:0,streak:0};showScreen('screen-sort');loadSortRound();}
  if(m==='pipeline'){initPipeline();showScreen('screen-pipeline');}
  if(m==='quiz'){quizState={idx:0,score:0,answered:false};showScreen('screen-quiz');loadQ();}
}

function loadSortRound(){
  const r=sortRounds[sortState.round];
  document.getElementById('sort-round').textContent=sortState.round+1;
  document.getElementById('sort-total').textContent=sortRounds.length;
  document.getElementById('sort-score').textContent=sortState.score;
  document.getElementById('sort-prog').style.width=(sortState.round/sortRounds.length*100)+'%';
  if(sortState.streak>1){document.getElementById('ss-box').style.display='';document.getElementById('ss-val').textContent=sortState.streak;}
  else document.getElementById('ss-box').style.display='none';
  document.getElementById('sort-fb').style.display='none';
  document.getElementById('sort-nav').style.display='none';
  document.getElementById('sort-back').style.display='';

  document.getElementById('sort-tray').innerHTML=`
    <div class="drag-item" draggable="true" id="drag-item" ondragstart="dragStart(event)" ontouchstart="touchStart(event)" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">
      ${svgIcons[r.itemSvg]}
      <div style="font-size:14px;color:var(--color-text-secondary);text-align:center;">${r.label}</div>
    </div>`;

  const zones=document.getElementById('sort-zones');
  zones.innerHTML='';
  const shuffledZones=shuffle(r.zones);
  shuffledZones.forEach(it=>{
    const z=document.createElement('div');
    z.className='drop-zone';z.id='zone-'+it.id;z.dataset.zid=it.id;
    z.ondragover=e=>{e.preventDefault();z.classList.add('over');};
    z.ondragleave=()=>z.classList.remove('over');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('over');dropOnZone(it.id,r);};
    z.innerHTML=`${svgIcons[it.svg]}<div class="zone-label">${it.label}</div><div id="zi-${it.id}"></div>`;
    zones.appendChild(z);
  });
}

function dragStart(e){e.dataTransfer.setData('text','item');}
function dropOnZone(zid,round){
  const chosen=round.zones.find(x=>x.id===zid);
  const fb=document.getElementById('sort-fb');
  document.getElementById('drag-item').classList.add('placed');
  const chip=document.createElement('div');
  chip.className='result-chip';
  if(chosen.correct){
    sortState.score+=10+sortState.streak*2;sortState.streak++;
    document.getElementById('zone-'+zid).classList.add('correct');
    chip.className='result-chip chip-ok';chip.textContent='✓';
    document.getElementById('zi-'+zid).appendChild(chip);
    fb.className='feedback success';fb.innerHTML=`<b>Correct!</b> ${round.zones.find(x=>x.correct).hint}`;
  } else {
    sortState.streak=0;
    document.getElementById('zone-'+zid).classList.add('wrong');
    chip.className='result-chip chip-bad';chip.textContent='✗';
    document.getElementById('zi-'+zid).appendChild(chip);
    const cv=round.zones.find(x=>x.correct);
    document.getElementById('zone-'+cv.id).classList.add('correct');
    fb.className='feedback error';fb.innerHTML=`<b>Not quite.</b> Goes in <b>${cv.label}</b>. ${cv.hint}`;
    document.querySelectorAll('.drop-zone').forEach(z=>{z.ondrop=null;z.ondragover=null;});
  }
  fb.style.display='';
  document.getElementById('sort-nav').style.display='';
  document.getElementById('sort-back').style.display='none';
  document.getElementById('sort-score').textContent=sortState.score;
  if(sortState.streak>1){document.getElementById('ss-box').style.display='';document.getElementById('ss-val').textContent=sortState.streak;}
}

let _tEl=null,_tClone=null;
function touchStart(e){
  _tEl=e.currentTarget;_tClone=_tEl.cloneNode(true);
  _tClone.style.cssText='position:fixed;opacity:.75;pointer-events:none;z-index:9999;';
  document.body.appendChild(_tClone);
}
function touchMove(e){
  if(!_tClone)return;
  const t=e.touches[0];
  _tClone.style.left=(t.clientX-35)+'px';_tClone.style.top=(t.clientY-35)+'px';
  e.preventDefault();
}
function touchEnd(e){
  if(_tClone){_tClone.remove();_tClone=null;}
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(!el)return;
  const zone=el.closest('.drop-zone');
  if(zone){const r=sortRounds[sortState.round];dropOnZone(zone.dataset.zid,r);}
  _tEl=null;
}

function initPipeline(){
  pipeState.order=[];
  const slots=document.getElementById('pipe-slots');
  slots.innerHTML='';
  for(let i=0;i<pipelineStages.length;i++){
    const s=document.createElement('div');s.className='pipe-slot';s.id='slot-'+i;
    s.innerHTML=`<span style="font-size:14px;color:var(--color-text-tertiary);">Step ${i+1}</span>`;
    s.ondragover=e=>{e.preventDefault();s.style.borderColor='#1D9E75';s.style.background='#E1F5EE';};
    s.ondragleave=()=>{s.style.borderColor='';s.style.background='';};
    s.ondrop=e=>{e.preventDefault();s.style.borderColor='';s.style.background='';dropPipe(i,e);};
    slots.appendChild(s);
  }
  const bank=document.getElementById('pipe-bank');bank.innerHTML='';
  shuffle(pipelineStages).forEach(st=>{
    const b=document.createElement('div');b.className='bank-item';b.draggable=true;b.id='bank-'+st.id;b.dataset.stid=st.id;
    b.innerHTML=`${svgIcons[st.icon]}<div><div style="font-size:15px;font-weight:500;color:var(--color-text-primary)">${st.name}</div><div style="font-size:12px;color:var(--color-text-secondary)">${st.sub}</div></div>`;
    b.ondragstart=e=>e.dataTransfer.setData('stid',st.id);
    bank.appendChild(b);
  });
  document.getElementById('pipe-fb').style.display='none';
}
function dropPipe(idx,e){
  const stid=parseInt(e.dataTransfer.getData('stid'));
  const stage=pipelineStages.find(s=>s.id===stid);if(!stage)return;
  if(pipeState.order[idx]!==undefined){const prev=document.getElementById('bank-'+pipeState.order[idx]);if(prev)prev.classList.remove('placed');}
  pipeState.order[idx]=stid;
  const slot=document.getElementById('slot-'+idx);
  slot.innerHTML=`${svgIcons[stage.icon]}<div><div style="font-size:15px;font-weight:500;color:var(--color-text-primary)">${stage.name}</div><div style="font-size:12px;color:var(--color-text-secondary)">${stage.sub}</div></div>`;
  const bel=document.getElementById('bank-'+stid);if(bel)bel.classList.add('placed');
}
function checkPipeline(){
  pipeState.attempts++;document.getElementById('pipe-att').textContent=pipeState.attempts;
  let correct=0,allFilled=true;
  for(let i=0;i<pipelineStages.length;i++){if(pipeState.order[i]===undefined){allFilled=false;break;}if(pipeState.order[i]===pipelineStages[i].id)correct++;}
  const fb=document.getElementById('pipe-fb');
  if(!allFilled){fb.className='feedback error';fb.textContent='Fill all 6 slots first.';fb.style.display='';return;}
  if(correct===6){
    fb.className='feedback success';fb.innerHTML='<b>Perfect!</b> You mapped the full valorisation pipeline correctly.';fb.style.display='';
    setTimeout(()=>{
      document.getElementById('res-t').textContent='Challenge 2 complete!';
      document.getElementById('res-s').textContent='Pipeline ordering results:';
      document.getElementById('res-g').innerHTML=`<div class="result-card"><div class="rc-val">${pipeState.attempts}</div><div class="rc-lbl">Attempts</div></div><div class="result-card"><div class="rc-val">6/6</div><div class="rc-lbl">Correct stages</div></div>`;
      document.getElementById('res-tip').textContent='Each stage adds value: segregation enables digestion, de-watering cuts costs, biogas generates energy, digestate closes the nutrient loop.';
      showScreen('screen-results');
    },1600);
  } else {
    fb.className='feedback error';fb.innerHTML=`<b>${correct}/6 correct.</b> Hint: start with separating waste at source, then reduce its volume before the digester.`;fb.style.display='';
  }
}
function resetPipeline(){initPipeline();}

function loadQ(){
  const q=quizQs[quizState.idx];
  document.getElementById('quiz-num').textContent=quizState.idx+1;
  document.getElementById('quiz-tot').textContent=quizQs.length;
  document.getElementById('quiz-sc').textContent=quizState.score;
  document.getElementById('quiz-prog').style.width=Math.round((quizState.idx/quizQs.length)*100)+'%';
  document.getElementById('quiz-q').textContent=q.q;
  const opts=document.getElementById('quiz-opts');opts.innerHTML='';
  const shuffledOpts=shuffle(q.opts);
  shuffledOpts.forEach(o=>{
    const b=document.createElement('button');b.className='quiz-opt';
    b.innerHTML=`${svgIcons[o.svg]}<div class="opt-label">${o.l}</div>`;
    b.onclick=()=>answerQ(o.c,b,q.exp);
    opts.appendChild(b);
  });
  document.getElementById('quiz-fb').style.display='none';
  document.getElementById('quiz-nav').style.display='none';
  quizState.answered=false;
}
function answerQ(correct,btn,exp){
  if(quizState.answered)return;quizState.answered=true;
  document.querySelectorAll('.quiz-opt').forEach(o=>o.disabled=true);
  const fb=document.getElementById('quiz-fb');
  if(correct){quizState.score+=10;btn.classList.add('correct');fb.className='feedback success';fb.innerHTML=`<b>Correct!</b> ${exp}`;}
  else{btn.classList.add('wrong');fb.className='feedback error';fb.innerHTML=`<b>Not quite.</b> ${exp}`;}
  fb.style.display='';document.getElementById('quiz-sc').textContent=quizState.score;
  document.getElementById('quiz-nav').style.display='';
}
function nextQ(){
  quizState.idx++;
  if(quizState.idx>=quizQs.length){
    const pct=Math.round((quizState.score/(quizQs.length*10))*100);
    let msg=pct>=80?'Excellent! You understand the full zero-waste valorisation cycle.':pct>=50?'Good effort! Review how digestion and BSF farming close the loop.':'Keep exploring — revisit the pipeline and try again!';
    document.getElementById('res-t').textContent='Challenge 3 complete!';
    document.getElementById('res-s').textContent='Quiz results:';
    document.getElementById('res-g').innerHTML=`<div class="result-card"><div class="rc-val">${quizState.score}</div><div class="rc-lbl">Score</div></div><div class="result-card"><div class="rc-val">${pct}%</div><div class="rc-lbl">Accuracy</div></div>`;
    document.getElementById('res-tip').textContent=msg;
    showScreen('screen-results');return;
  }
  loadQ();
}
</script>
